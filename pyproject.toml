[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["talos*"]

[project]
name = "talos"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
app = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg2-binary",
    "psycopg[binary]",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres",
    "requests",
    "alembic",
    "sqlalchemy",
    "PyJWT>=2.0",
    "cryptography",
    "argon2-cffi",
]
test = [
    "pytest",
    "pytest-asyncio",
    "psycopg2-binary",
    "psycopg[binary]",
    "testcontainers[postgres]",
    "httpx",
    "fastapi",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres",
    "requests",
    "alembic",
    "sqlalchemy",
    "PyJWT>=2.0",
    "cryptography",
    "argon2-cffi",
]
experiment = [
    "claude-agent-sdk",
]
